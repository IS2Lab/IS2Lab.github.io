<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="A security property (no flow from secret to observer) holds on an abstract model; the question is whether it survives refinement into a concurrent implementation, where interleaving can open new flows. Security-preserving refinement guarantees it does" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="480" height="270" fill="#e7eef8"/>
  <defs>
    <marker id="ob" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#003f88"/></marker>
    <marker id="orr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
  </defs>
  <g font-family="ui-monospace, Menlo, monospace">
    <!-- abstract model -->
    <text x="40" y="20" font-size="11" fill="#003f88">abstract model M</text>
    <rect x="40" y="26" width="240" height="62" rx="8" fill="#ffffff" stroke="#003f88" stroke-width="2.5"/>
    <circle cx="92" cy="57" r="17" fill="#003f88"/><text x="92" y="62" font-size="13" fill="#ffffff" text-anchor="middle">H</text>
    <circle cx="228" cy="57" r="17" fill="#ffffff" stroke="#003f88" stroke-width="2.5"/><text x="228" y="62" font-size="13" fill="#003f88" text-anchor="middle">L</text>
    <line x1="160" y1="36" x2="160" y2="78" stroke="#0b6e74" stroke-width="5" stroke-linecap="round"/>
    <text x="92" y="84" font-size="9" fill="#003f88" text-anchor="middle">secret</text>
    <text x="228" y="84" font-size="9" fill="#003f88" text-anchor="middle">observer</text>
    <text x="300" y="52" font-size="14" fill="#003f88">M ⊨ φ</text>
    <text x="300" y="72" font-size="11" fill="#0b6e74">no flow H → L ✓</text>
    <!-- refinement -->
    <path d="M160 92 V122" stroke="#003f88" stroke-width="2.5" marker-end="url(#ob)"/>
    <text x="172" y="112" font-size="12" fill="#003f88">⊑ refine</text>
    <!-- concurrent implementation -->
    <text x="40" y="138" font-size="11" fill="#003f88">concurrent implementation I</text>
    <rect x="40" y="144" width="240" height="62" rx="8" fill="#ffffff" stroke="#003f88" stroke-width="2.5"/>
    <circle cx="70" cy="175" r="15" fill="#003f88"/><text x="70" y="180" font-size="12" fill="#ffffff" text-anchor="middle">H</text>
    <circle cx="250" cy="175" r="15" fill="#ffffff" stroke="#003f88" stroke-width="2.5"/><text x="250" y="180" font-size="12" fill="#003f88" text-anchor="middle">L</text>
    <!-- two interleaving threads -->
    <g stroke="#7a9cc8" stroke-width="2" fill="none">
      <path d="M96 160 H224"/><path d="M96 190 H224"/>
      <path d="M118 160 L134 190 M150 190 L166 160 M182 160 L198 190"/>
    </g>
    <text x="160" y="155" font-size="9" fill="#5a7398" text-anchor="middle">thread 1 ∥ thread 2</text>
    <!-- possible new flow through interleaving -->
    <path d="M86 176 C 130 214, 190 214, 232 180" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#orr)"/>
    <text x="300" y="170" font-size="14" fill="#003f88">I ⊨ φ ?</text>
    <text x="300" y="190" font-size="11" fill="#c2410c">interleaving may leak</text>
    <!-- the result -->
    <rect x="24" y="222" width="432" height="38" rx="19" fill="#003f88"/>
    <text x="240" y="246" font-size="13" fill="#ffffff" text-anchor="middle">security-preserving refinement: M ⊨ φ ∧ I ⊑ M ⇒ I ⊨ φ</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
