<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="AI systems and industrial control software running on an OS kernel; refinement checks each level and finds a concurrency flaw in the kernel" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="480" height="270" fill="#e7eef8"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" text-anchor="middle">
    <!-- layers, top to bottom -->
    <rect x="110" y="26" width="220" height="34" rx="4" fill="#ffffff" stroke="#003f88" stroke-width="2.5"/>
    <text x="220" y="48" fill="#003f88">AI systems</text>
    <rect x="110" y="70" width="220" height="34" rx="4" fill="#ffffff" stroke="#003f88" stroke-width="2.5"/>
    <text x="220" y="92" fill="#003f88">industrial control software</text>
    <rect x="110" y="114" width="220" height="34" rx="4" fill="#ffffff" stroke="#003f88" stroke-width="2.5"/>
    <text x="220" y="136" fill="#003f88">system calls</text>
    <rect x="110" y="158" width="220" height="34" rx="4" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/>
    <text x="220" y="180" fill="#003f88">OS kernel · concurrency</text>
    <rect x="110" y="202" width="220" height="34" rx="4" fill="#003f88"/>
    <text x="220" y="224" fill="#ffffff">hardware</text>
  </g>
  <!-- crack in the kernel layer -->
  <path d="M326 158 l-8 10 l8 6 l-9 10 l6 8" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- refinement arrows on the left -->
  <g fill="none" stroke="#0b6e74" stroke-width="2.5" stroke-linecap="round">
    <path d="M92 43 V209"/>
    <path d="M86 203 l6 8 l6 -8"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#0b6e74" text-anchor="middle">
    <text x="66" y="92">⊑</text><text x="66" y="136">⊑</text><text x="66" y="180">⊑</text>
  </g>
  <!-- checks and a found flaw on the right -->
  <g>
    <circle cx="364" cy="43" r="12" fill="#0b6e74"/><circle cx="364" cy="87" r="12" fill="#0b6e74"/><circle cx="364" cy="131" r="12" fill="#0b6e74"/>
    <path d="M358 43 l4 4 l8 -8 M358 87 l4 4 l8 -8 M358 131 l4 4 l8 -8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="364" cy="175" r="12" fill="#c2410c"/>
    <path d="M364 168 v8 M364 181 v1" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="388" y="180" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#c2410c">found</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
