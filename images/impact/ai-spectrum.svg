<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="Left: systematic testing samples an input region and finds an input where the model violates its property. Right: provable repair changes the model so the property holds for every input in the region, for neural networks, LLMs and agents" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="480" height="270" fill="#eeeaf7"/>
  <defs>
    <marker id="vv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b3aa0"/></marker>
    <clipPath id="lp"><rect x="24" y="40" width="190" height="142" rx="8"/></clipPath>
    <clipPath id="rp"><rect x="266" y="40" width="190" height="142" rx="8"/></clipPath>
  </defs>
  <g font-family="ui-monospace, Menlo, monospace">
    <text x="240" y="16" font-size="11" fill="#5b3aa0" text-anchor="middle">model f: neural network → LLM → agent</text>
    <!-- left: testing finds a violation (∃x) -->
    <text x="119" y="34" font-size="11" fill="#c2410c" text-anchor="middle">testing: ∃x ∈ R. ¬φ(f(x))</text>
    <rect x="24" y="40" width="190" height="142" rx="8" fill="#ffffff" stroke="#cfc4ea" stroke-width="2"/>
    <g clip-path="url(#lp)">
      <path d="M24 150 C 70 140, 92 70, 140 82 C 170 90, 190 60, 214 56" fill="none" stroke="#5b3aa0" stroke-width="2.5"/>
      <ellipse cx="118" cy="110" rx="56" ry="38" fill="none" stroke="#5b3aa0" stroke-width="2" stroke-dasharray="6 4"/>
    </g>
    <text x="64" y="80" font-size="11" fill="#5b3aa0">R</text>
    <g fill="#b9a2ee">
      <circle cx="80" cy="112" r="4"/><circle cx="100" cy="132" r="4"/><circle cx="122" cy="122" r="4"/><circle cx="146" cy="128" r="4"/>
      <circle cx="96" cy="98" r="4"/><circle cx="160" cy="112" r="4"/><circle cx="136" cy="140" r="4"/>
    </g>
    <g stroke="#c2410c" stroke-width="3.5" stroke-linecap="round"><path d="M126 86 l12 12 M138 86 l-12 12"/></g>
    <text x="119" y="174" font-size="10" fill="#5a4a7a" text-anchor="middle">tests find a counterexample</text>
    <!-- repair arrow -->
    <path d="M220 111 H258" stroke="#5b3aa0" stroke-width="3" marker-end="url(#vv)"/>
    <text x="240" y="103" font-size="10" fill="#5b3aa0" text-anchor="middle">repair</text>
    <!-- right: provable repair (∀x) -->
    <text x="361" y="34" font-size="11" fill="#0b6e74" text-anchor="middle">repair: ∀x ∈ R. φ(f′(x))</text>
    <rect x="266" y="40" width="190" height="142" rx="8" fill="#ffffff" stroke="#5b3aa0" stroke-width="2.5"/>
    <g clip-path="url(#rp)">
      <ellipse cx="360" cy="110" rx="56" ry="38" fill="#cfeeea" stroke="#0b6e74" stroke-width="2.5"/>
      <path d="M266 150 C 300 146, 300 66, 330 64 C 360 62, 400 62, 456 56" fill="none" stroke="#5b3aa0" stroke-width="2.5"/>
    </g>
    <text x="360" y="114" font-size="13" fill="#0b6e74" text-anchor="middle">R</text>
    <circle cx="430" cy="150" r="14" fill="#0b6e74"/>
    <path d="M423 150 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="361" y="174" font-size="10" fill="#5a4a7a" text-anchor="middle">whole region certified</text>
    <!-- takeaway -->
    <rect x="24" y="204" width="432" height="44" rx="22" fill="#5b3aa0"/>
    <text x="240" y="222" font-size="11" fill="#e4dbf7" text-anchor="middle">from finitely many tests to a guarantee</text>
    <text x="240" y="240" font-size="13" fill="#ffffff" text-anchor="middle">find with ∃ (testing) · fix with ∀ (proof)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
