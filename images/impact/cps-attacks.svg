<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="A water tank whose level sensor is spoofed by an attacker, feeding a false reading to the controller" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="480" height="270" fill="#e3f1f1"/>
  <!-- tank with real water level -->
  <g>
    <rect x="44" y="60" width="120" height="160" rx="6" fill="#ffffff" stroke="#0b6e74" stroke-width="3"/>
    <rect x="47" y="78" width="114" height="139" fill="#9fd3d3"/>
    <path d="M47 78 q14 -6 28 0 t28 0 t28 0 t30 0" fill="none" stroke="#0b6e74" stroke-width="2"/>
    <text x="104" y="246" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#0b6e74" text-anchor="middle">real level: 92%</text>
  </g>
  <!-- inflow pipe and pump -->
  <path d="M164 196 H206" stroke="#0b6e74" stroke-width="8"/>
  <circle cx="222" cy="196" r="16" fill="#ffffff" stroke="#0b6e74" stroke-width="3"/>
  <path d="M214 196 h16 M222 188 v16" stroke="#0b6e74" stroke-width="3"/>
  <!-- sensor on the tank -->
  <circle cx="164" cy="90" r="10" fill="#0b6e74"/>
  <!-- spoofed signal path -->
  <path d="M174 90 C 230 90, 250 70, 300 70" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="7 5"/>
  <!-- attacker -->
  <g transform="translate(236 120)">
    <circle cx="0" cy="-8" r="11" fill="#c2410c"/>
    <path d="M-17 18 a17 14 0 0 1 34 0 z" fill="#c2410c"/>
    <rect x="-9" y="-12" width="18" height="6" rx="2" fill="#ffffff"/>
  </g>
  <path d="M236 106 L 236 84" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- controller with false reading -->
  <rect x="300" y="38" width="140" height="70" rx="6" fill="#ffffff" stroke="#003f88" stroke-width="3"/>
  <text x="370" y="62" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#003f88" text-anchor="middle">controller</text>
  <text x="370" y="88" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#c2410c" text-anchor="middle">level: 40%</text>
  <!-- command back to pump: keep filling -->
  <path d="M370 108 V196 H240" fill="none" stroke="#003f88" stroke-width="2.5"/>
  <path d="M248 190 l-8 6 l8 6" fill="none" stroke="#003f88" stroke-width="2.5" stroke-linecap="round"/>
  <text x="378" y="160" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#003f88">pump ON</text>
  <!-- unsafe-state warning -->
  <path d="M104 30 l14 24 h-28 z" fill="#c2410c"/>
  <path d="M104 38 v8 M104 50 v1" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
