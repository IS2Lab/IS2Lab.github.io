      <line x1="46" y1="106" x2="96" y2="106"/><line x1="46" y1="118" x2="86" y2="118"/>
      <line x1="46" y1="210" x2="96" y2="210"/><line x1="46" y1="222" x2="80" y2="222"/>
    </g>
    <text x="71" y="170" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#c2410c" text-anchor="middle">forget ✓</text>
  </g>
  <!-- arrows into the model -->
  <g stroke="#5b3aa0" stroke-width="2" fill="none"><path d="M108 60 L170 120 M108 112 L170 130 M108 216 L170 150"/></g>
