  <g stroke="#b9a2ee" stroke-width="1.6">
    <path d="M196 108 L230 100 M196 108 L230 135 M196 135 L230 100 M196 135 L230 135 M196 162 L230 135 M196 162 L230 170 M230 100 L264 135 M230 135 L264 135 M230 170 L264 135"/>
  </g>
  <g fill="#5b3aa0">
    <circle cx="196" cy="108" r="6"/><circle cx="196" cy="135" r="6"/><circle cx="196" cy="162" r="6"/>
    <circle cx="230" cy="100" r="6"/><circle cx="230" cy="135" r="6"/><circle cx="230" cy="170" r="6"/>
    <circle cx="264" cy="135" r="6"/>
  </g>
