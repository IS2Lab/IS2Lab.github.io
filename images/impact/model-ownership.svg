  <text x="392" y="150" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5b3aa0" text-anchor="middle">model</text>
  <path d="M296 135 H332" stroke="#5b3aa0" stroke-width="2.5"/>
  <path d="M326 129 l8 6 l-8 6" fill="none" stroke="#5b3aa0" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(392 214)">
