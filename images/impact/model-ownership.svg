<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="A model with an ownership mark and a suspicious copy being tested; training records with one being verifiably removed" xmlns:c2pa="http://c2pa.org/manifest">
