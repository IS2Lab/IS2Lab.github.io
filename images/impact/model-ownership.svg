  <!-- data records on the left, one being removed -->
  <g>
    <rect x="34" y="40" width="74" height="40" rx="5" fill="#ffffff" stroke="#5b3aa0" stroke-width="2.5"/>
    <rect x="34" y="92" width="74" height="40" rx="5" fill="#ffffff" stroke="#5b3aa0" stroke-width="2.5"/>
    <rect x="34" y="144" width="74" height="40" rx="5" fill="#ffffff" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="6 4"/>
    <rect x="34" y="196" width="74" height="40" rx="5" fill="#ffffff" stroke="#5b3aa0" stroke-width="2.5"/>
    <g stroke="#b9a2ee" stroke-width="4" stroke-linecap="round">
