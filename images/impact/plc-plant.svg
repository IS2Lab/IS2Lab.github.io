<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="A discrete control program and continuous physical dynamics form one hybrid system; hybrid refinement logic proves that the trajectory of the whole closed loop never enters the unsafe region" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="480" height="270" fill="#e3f1f1"/>
  <defs><marker id="ct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b6e74"/></marker></defs>
  <g font-family="ui-monospace, Menlo, monospace">
    <!-- discrete program: a small state machine -->
    <text x="30" y="22" font-size="11" fill="#003f88">discrete control program</text>
    <rect x="30" y="28" width="170" height="130" rx="8" fill="#ffffff" stroke="#003f88" stroke-width="2.5"/>
    <circle cx="74" cy="72" r="20" fill="#ffffff" stroke="#003f88" stroke-width="2.5"/><text x="74" y="77" font-size="12" fill="#003f88" text-anchor="middle">fill</text>
    <circle cx="156" cy="72" r="20" fill="#ffffff" stroke="#003f88" stroke-width="2.5"/><text x="156" y="77" font-size="12" fill="#003f88" text-anchor="middle">stop</text>
    <path d="M94 64 Q115 50 136 64" fill="none" stroke="#003f88" stroke-width="2" marker-end="url(#ct)"/>
    <path d="M136 82 Q115 96 94 82" fill="none" stroke="#003f88" stroke-width="2" marker-end="url(#ct)"/>
    <text x="115" y="46" font-size="10" fill="#003f88" text-anchor="middle">x ≥ hi</text>
    <text x="115" y="108" font-size="10" fill="#003f88" text-anchor="middle">x ≤ lo</text>
    <text x="115" y="140" font-size="11" fill="#5a7398" text-anchor="middle">scan cycles, jumps</text>
    <!-- continuous dynamics: trajectory and unsafe region -->
    <text x="280" y="22" font-size="11" fill="#0b6e74">physical dynamics ẋ = f(x,u)</text>
    <rect x="280" y="28" width="170" height="130" rx="8" fill="#ffffff" stroke="#0b6e74" stroke-width="2.5"/>
    <rect x="283" y="31" width="164" height="26" fill="#fbe3d6"/>
    <line x1="283" y1="57" x2="447" y2="57" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="440" y="48" font-size="10" fill="#c2410c" text-anchor="end">unsafe</text>
    <path d="M292 140 V146 H442" stroke="#9ab" stroke-width="1.5" fill="none"/>
    <path d="M292 132 C 310 120, 322 86, 340 76 C 352 70, 360 92, 372 102 C 384 112, 392 82, 408 76 C 420 72, 428 96, 442 100" fill="none" stroke="#0b6e74" stroke-width="3"/>
    <text x="436" y="140" font-size="10" fill="#5a7398" text-anchor="end">t</text>
    <!-- coupling -->
    <path d="M200 70 H274" stroke="#0b6e74" stroke-width="2.5" marker-end="url(#ct)"/>
    <text x="238" y="62" font-size="10" fill="#0b6e74" text-anchor="middle">actuate u</text>
    <path d="M280 120 H206" stroke="#0b6e74" stroke-width="2.5" marker-end="url(#ct)"/>
    <text x="242" y="136" font-size="10" fill="#0b6e74" text-anchor="middle">sense x</text>
    <!-- the question and the answer -->
    <text x="240" y="186" font-size="12" fill="#003f88" text-anchor="middle">discrete ∥ continuous: one hybrid system, one proof?</text>
    <rect x="44" y="204" width="392" height="44" rx="22" fill="#0b6e74"/>
    <text x="240" y="222" font-size="11" fill="#cdeeee" text-anchor="middle">hybrid refinement logic</text>
    <text x="240" y="240" font-size="13" fill="#ffffff" text-anchor="middle">⊢ program ∥ dynamics : □ safe</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
