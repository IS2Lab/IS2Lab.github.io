<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="A factory and a power pylon controlled by a PLC running verified ladder logic" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="480" height="270" fill="#e7eef8"/>
  <g fill="none" stroke="#003f88" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- ground -->
    <line x1="24" y1="222" x2="456" y2="222"/>
    <!-- factory with saw-tooth roof -->
    <path d="M44 222 V132 L84 108 V132 L124 108 V132 L164 108 V222"/>
    <path d="M164 222 V96 H186 V222"/>
    <rect x="60" y="160" width="22" height="22"/>
    <rect x="100" y="160" width="22" height="22"/>
    <rect x="140" y="160" width="14" height="62"/>
    <!-- smoke -->
    <path d="M175 86 c-8 -8 6 -14 -2 -24 c-6 -8 4 -14 0 -22" stroke="#7a9cc8" stroke-width="2.5"/>
    <!-- power pylon -->
    <path d="M396 222 L414 64 L432 222"/>
    <path d="M380 92 H448 M386 122 H442"/>
    <path d="M401 160 L427 122 M427 160 L401 122 M405 196 L423 160 M423 196 L405 160"/>
    <path d="M380 92 c-30 6 -60 14 -96 30 M448 92 c10 2 18 4 24 6" stroke="#7a9cc8" stroke-width="2"/>
  </g>
  <!-- PLC cabinet -->
  <g>
    <rect x="216" y="98" width="148" height="124" rx="6" fill="#ffffff" stroke="#003f88" stroke-width="3"/>
    <rect x="228" y="110" width="124" height="16" rx="3" fill="#003f88"/>
    <text x="290" y="122" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#ffffff" text-anchor="middle">PLC · ST</text>
    <!-- ladder logic -->
    <g fill="none" stroke="#0b6e74" stroke-width="2.5" stroke-linecap="round">
      <line x1="236" y1="138" x2="236" y2="206"/>
      <line x1="344" y1="138" x2="344" y2="206"/>
      <path d="M236 152 H258 M258 144 V160 M266 144 V160 M266 152 H300"/>
      <circle cx="310" cy="152" r="9"/>
      <path d="M319 152 H344"/>
      <path d="M236 188 H258 M258 180 V196 M266 180 V196 M266 188 H282 M282 180 V196 M290 180 V196 M290 188 H300"/>
      <circle cx="310" cy="188" r="9"/>
      <path d="M319 188 H344"/>
    </g>
  </g>
  <!-- verified badge -->
  <g>
    <circle cx="362" cy="100" r="20" fill="#0b6e74"/>
    <path d="M352 100 l7 7 l13 -14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- a caught bug -->
  <g transform="translate(190 236)">
    <text x="0" y="16" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#003f88">⊢ semantics ✓   compiler bug ✗ found</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
