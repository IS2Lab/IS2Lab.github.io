<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="A neural network making decisions about people, inspected with a magnifying glass that finds an unfair outcome" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="480" height="270" fill="#e3f1f1"/>
  <!-- network edges -->
  <g stroke="#7fb3b3" stroke-width="1.8">
    <path d="M60 70 L150 50 M60 70 L150 110 M60 70 L150 170 M60 135 L150 50 M60 135 L150 110 M60 135 L150 170 M60 135 L150 230 M60 200 L150 110 M60 200 L150 170 M60 200 L150 230"/>
    <path d="M150 50 L240 90 M150 50 L240 180 M150 110 L240 90 M150 110 L240 180 M150 170 L240 90 M150 170 L240 180 M150 230 L240 180 M150 230 L240 90"/>
    <path d="M240 90 L300 135 M240 180 L300 135"/>
  </g>
  <!-- nodes -->
  <g fill="#ffffff" stroke="#0b6e74" stroke-width="3">
    <circle cx="60" cy="70" r="12"/><circle cx="60" cy="135" r="12"/><circle cx="60" cy="200" r="12"/>
    <circle cx="150" cy="50" r="12"/><circle cx="150" cy="110" r="12"/><circle cx="150" cy="170" r="12"/><circle cx="150" cy="230" r="12"/>
    <circle cx="240" cy="90" r="12"/><circle cx="240" cy="180" r="12"/>
    <circle cx="300" cy="135" r="14"/>
  </g>
  <!-- outputs: people with decisions -->
  <g stroke="#0b6e74" stroke-width="2" fill="none" stroke-dasharray="4 4">
    <path d="M314 135 L362 60 M314 135 L362 110 M314 135 L362 160 M314 135 L362 210"/>
  </g>
  <g fill="#0b6e74">
    <circle cx="380" cy="52" r="8"/><path d="M368 76 a12 10 0 0 1 24 0 z"/>
    <circle cx="380" cy="102" r="8"/><path d="M368 126 a12 10 0 0 1 24 0 z"/>
    <circle cx="380" cy="202" r="8"/><path d="M368 226 a12 10 0 0 1 24 0 z"/>
  </g>
  <g fill="#c2410c">
    <circle cx="380" cy="152" r="8"/><path d="M368 176 a12 10 0 0 1 24 0 z"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">
    <text x="404" y="70" fill="#0b6e74">✓</text><text x="404" y="120" fill="#0b6e74">✓</text>
    <text x="404" y="170" fill="#c2410c">✗</text><text x="404" y="220" fill="#0b6e74">✓</text>
  </g>
  <!-- magnifier over the unfair case -->
  <circle cx="392" cy="160" r="34" fill="none" stroke="#003f88" stroke-width="5"/>
  <line x1="417" y1="185" x2="446" y2="214" stroke="#003f88" stroke-width="9" stroke-linecap="round"/>
  <text x="150" y="262" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#0b6e74" text-anchor="middle">test · verify · repair</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
