<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="An AI agent chatting on a phone; compressing the model reveals a hidden backdoor, caught by a safety check" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="480" height="270" fill="#eeeaf7"/>
  <!-- agent head -->
  <g fill="#ffffff" stroke="#5b3aa0" stroke-width="3" stroke-linejoin="round">
    <rect x="44" y="86" width="104" height="88" rx="18"/>
    <line x1="96" y1="86" x2="96" y2="64"/>
  </g>
  <circle cx="96" cy="58" r="7" fill="#5b3aa0"/>
  <circle cx="76" cy="124" r="9" fill="#5b3aa0"/><circle cx="116" cy="124" r="9" fill="#5b3aa0"/>
  <path d="M76 150 h40" stroke="#5b3aa0" stroke-width="4" stroke-linecap="round"/>
  <rect x="32" y="114" width="12" height="24" rx="4" fill="#5b3aa0"/><rect x="148" y="114" width="12" height="24" rx="4" fill="#5b3aa0"/>
  <!-- chat bubbles -->
  <g fill="#ffffff" stroke="#5b3aa0" stroke-width="2.5">
    <path d="M176 40 h120 a10 10 0 0 1 10 10 v26 a10 10 0 0 1 -10 10 h-104 l-16 12 v-12 a10 10 0 0 1 -10 -10 v-26 a10 10 0 0 1 10 -10 z"/>
  </g>
  <g stroke="#b9a2ee" stroke-width="4" stroke-linecap="round"><line x1="190" y1="58" x2="286" y2="58"/><line x1="190" y1="70" x2="256" y2="70"/></g>
  <!-- model weights → quantized -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5b3aa0">
    <rect x="176" y="118" width="96" height="58" rx="6" fill="#ffffff" stroke="#5b3aa0" stroke-width="2.5"/>
    <text x="224" y="140" text-anchor="middle">FP32</text>
    <text x="224" y="160" text-anchor="middle">0.4172…</text>
    <path d="M280 147 h34" stroke="#5b3aa0" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <rect x="324" y="118" width="96" height="58" rx="6" fill="#ffffff" stroke="#5b3aa0" stroke-width="2.5"/>
    <text x="372" y="140" text-anchor="middle">INT8</text>
    <text x="372" y="160" text-anchor="middle">0.42</text>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b3aa0"/></marker></defs>
  <!-- hidden backdoor bug appears after quantization -->
  <g transform="translate(410 120)">
    <ellipse cx="0" cy="0" rx="12" ry="15" fill="#c2410c"/>
    <circle cx="0" cy="-17" r="7" fill="#c2410c"/>
    <g stroke="#c2410c" stroke-width="2.5" stroke-linecap="round"><path d="M-12 -6 l-9 -5 M-12 4 l-10 0 M-12 12 l-9 5 M12 -6 l9 -5 M12 4 l10 0 M12 12 l9 5"/></g>
  </g>
  <!-- safety check -->
  <g transform="translate(240 202)">
    <rect x="-120" y="0" width="240" height="40" rx="20" fill="#5b3aa0"/>
    <text x="0" y="26" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#ffffff" text-anchor="middle">S-Eval · safety check</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
